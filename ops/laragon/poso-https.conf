# Local development only. Certificate must include both names and be trusted
# by the Windows account running the browser. Never deploy this private key.
<VirtualHost *:443>
    ServerName poso-portal.test
    ServerAlias portal.poso.test
    DocumentRoot "C:/laragon/www/poso-portal/public"
    SSLEngine on
    SSLCertificateFile "C:/laragon/etc/ssl/poso-portal.crt"
    SSLCertificateKeyFile "C:/laragon/etc/ssl/poso-portal.key"
    <Directory "C:/laragon/www/poso-portal/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
